name: Deploy to GitHub Pages

# Publishes by force-pushing main's tree to the gh-pages branch, which GitHub
# Pages serves directly. The artifact/deploy-pages route needs the Pages site
# created via admin API (configure-pages enablement), which GITHUB_TOKEN is
# not allowed to do; pushing gh-pages only needs contents: write.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish working tree to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          touch .nojekyll
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push --force origin gh-pages
